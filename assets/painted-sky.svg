 <path d="M-95 392C112 267 263 327 387 242c136-93 261-66 468-9" stroke="#a4a5d2" stroke-width="28" opacity=".32"/>
 <path d="M-91 493c171-97 348-125 486-73 194 72 295-101 451-73" stroke="#d9b7c5" stroke-width="28" opacity=".26"/>
 <path d="M-70 603C129 523 292 624 450 533c130-75 276-49 428 10" stroke="#d8c5d9" stroke-width="23" opacity=".31"/>
</g>
<!-- the moon and its halo -->
<circle cx="496" cy="299" r="236" fill="url(#moonLight)"/>
<circle cx="496" cy="299" r="101" fill="url(#moon)" opacity=".94"/>
<circle cx="477" cy="282" r="88" fill="#fff0c7" opacity=".2"/>
<circle cx="530" cy="327" r="24" fill="#b49570" opacity=".16"/>
<circle cx="468" cy="264" r="14" fill="#ba9e76" opacity=".18"/>
<circle cx="490" cy="347" r="9" fill="#b49570" opacity=".2"/>
<path d="M428 256c17-31 38-46 70-53" fill="none" stroke="#fff6d8" stroke-width="5" stroke-linecap="round" opacity=".45"/>
