<g fill="none" stroke-linecap="round">
 <path d="M-43 241c88-49 163-62 229-38 78 28 82 111 26 137-41 19-75-19-57-47 11-18 35-19 46-5" stroke="#6a91bb" stroke-width="28" opacity=".59" filter="url(#watercolor)"/>
 <path d="M-44 222c88-49 163-59 237-32 85 31 87 119 24 153" stroke="#b4bfdb" stroke-width="8" opacity=".5"/>
 <path d="M274 444c75-78 171-90 236-51 47 28 49 87 11 110-28 16-58-4-51-29 5-15 20-19 32-12" stroke="#90a2ce" stroke-width="24" opacity=".5" filter="url(#watercolor)"/>
 <path d="M265 428c90-69 184-77 256-20" stroke="#e4c9c7" stroke-width="7" opacity=".45"/>
 <path d="M588 93c95-52 165-35 242 13" stroke="#d1c1cd" stroke-width="19" opacity=".34" filter="url(#soft)"/>
 <path d="M-35 529c109-37 191-25 261 20 72 46 167 40 225 4" stroke="#f0cdbf" stroke-width="11" opacity=".24"/>
 <path d="M634 437c55-23 114-21 181 14" stroke="#a2add5" stroke-width="23" opacity=".36"/>
 <path d="M632 443c62-23 115-11 180 13" stroke="#d8bad1" stroke-width="5" opacity=".38"/>
</g>
<!-- sparkling night -->
<g fill="#f9e4b4">
 <circle cx="95" cy="104" r="3"/><circle cx="194" cy="79" r="3"/><circle cx="306" cy="111" r="2.5"/><circle cx="388" cy="78" r="3"/><circle cx="687" cy="82" r="3"/><circle cx="726" cy="267" r="3"/><circle cx="82" cy="454" r="3"/><circle cx="314" cy="331" r="3"/><circle cx="595" cy="497" r="2"/><circle cx="699" cy="537" r="3"/><circle cx="211" cy="461" r="2"/><circle cx="762" cy="365" r="2.5"/><circle cx="349" cy="37" r="2"/><circle cx="614" cy="177" r="2"/><circle cx="52" cy="44" r="2"/><circle cx="257" cy="267" r="2"/><circle cx="351" cy="520" r="2"/>
 </g>
 <g stroke="#f7e2ac" stroke-width="2.8" stroke-linecap="round" opacity=".92">
 <path d="M95 129v25m-12-12h24M286 74v21m-10-10h20M689 190v26m-13-13h26M354 292v28m-14-14h28M648 385v22m-11-11h22M123 537v18m-9-9h18"/>
 </g>
 <g fill="#fff5db" opacity=".7">
 <circle cx="138" cy="51" r="1.8"/><circle cx="231" cy="171" r="1.5"/><circle cx="365" cy="184" r="1.4"/><circle cx="429" cy="110" r="2"/><circle cx="591" cy="55" r="1.7"/><circle cx="724" cy="168" r="1.8"/><circle cx="767" cy="481" r="1.5"/><circle cx="549" cy="553" r="1.4"/><circle cx="48" cy="355" r="2"/><circle cx="178" cy="376" r="1.5"/><circle cx="734" cy="596" r="1.5"/>
 </g>
<!-- distant watercolor hills -->
<path d="M0 677c95-76 187-99 291-51 106 48 201-79 323-44 61 17 115 61 186 46V1000H0Z" fill="url(#far)" filter="url(#watercolor)"/>
<path d="M0 720c98-54 197-76 306-28 102 45 205-66 328-26 70 23 112 45 166 34v300H0Z" fill="#59618e" opacity=".56"/>
<!-- lake with moon reflections -->
<path d="M0 768c162-18 265-44 414-10 146 33 269 13 386-13v255H0Z" fill="#34486b"/>
<path d="M323 772c83 13 186 8 255-2M373 795c69 8 170 4 230-2M286 821c113 17 265 11 352-3M371 847c70 7 194 5 251-1M288 888c104 6 229 8 310-3" fill="none" stroke="url(#water)" stroke-width="7" stroke-linecap="round" opacity=".8"/>
<!-- nearer hills and flowering silhouettes -->
<path d="M0 814c119-93 197-72 283-32 96 46 203 2 278-28 96-37 157-19 239 15v231H0Z" fill="url(#near)" filter="url(#watercolor)"/>
<path d="M0 901c102-50 198-24 289-61 99-40 204 38 303-6 85-37 155-33 208 0v166H0Z" fill="#112947"/>
<g stroke="#c1b1ae" stroke-linecap="round" fill="none" opacity=".72">
 <path d="M93 958c-12-83 8-133 12-187m-6 127c-12-23-27-32-47-38m49-18c22-25 40-32 60-31" stroke-width="3"/>
 <path d="M682 982c-7-87 8-145 20-187m-14 126c-17-25-35-35-52-39m62-38c11-25 31-39 49-42" stroke-width="3"/>
 <path d="M733 1000c-5-72 5-104 18-151m-9 107c-12-23-22-29-37-36" stroke-width="2.4"/>
</g>
<g fill="#d8b6be" opacity=".86">
 <ellipse cx="103" cy="776" rx="10" ry="16" transform="rotate(-24 103 776)"/><ellipse cx="52" cy="859" rx="8" ry="12" transform="rotate(-36 52 859)"/><ellipse cx="159" cy="810" rx="7" ry="11" transform="rotate(45 159 810)"/>
 <ellipse cx="701" cy="797" rx="11" ry="16" transform="rotate(20 701 797)"/><ellipse cx="639" cy="882" rx="8" ry="13" transform="rotate(-42 639 882)"/><ellipse cx="746" cy="803" rx="9" ry="12" transform="rotate(36 746 803)"/>
</g>
<g fill="#eed5a4"><circle cx="108" cy="778" r="4"/><circle cx="701" cy="798" r="4"/><circle cx="54" cy="859" r="3"/><circle cx="641" cy="881" r="3"/></g>
<!-- watercolor paper texture -->
<rect width="800" height="1000" filter="url(#grain)" opacity=".11" style="mix-blend-mode:soft-light"/>
<rect x="9" y="9" width="782" height="982" fill="none" stroke="#fff4d8" stroke-opacity=".12" stroke-width="2"/>
</svg>