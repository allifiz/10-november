<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="A watercolor night painted for you">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2=".35" y2="1"><stop stop-color="#0b1b41"/><stop offset=".34" stop-color="#28436e"/><stop offset=".67" stop-color="#5869a1"/><stop offset="1" stop-color="#d59aa7"/></linearGradient>
 <radialGradient id="moonLight"><stop stop-color="#fce9b9" stop-opacity=".64"/><stop offset=".34" stop-color="#e7c48c" stop-opacity=".24"/><stop offset="1" stop-color="#e8c99a" stop-opacity="0"/></radialGradient>
 <radialGradient id="moon"><stop stop-color="#fff6cd"/><stop offset=".65" stop-color="#e8ce9b"/><stop offset="1" stop-color="#bd9b69"/></radialGradient>
 <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#555b8d"/><stop offset="1" stop-color="#252e62"/></linearGradient>
 <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#233d61"/><stop offset="1" stop-color="#0d2443"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bea3c9" stop-opacity=".1"/><stop offset=".52" stop-color="#fae3b1" stop-opacity=".58"/><stop offset="1" stop-color="#baadc9" stop-opacity=".15"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="10" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
 <filter id="watercolor" x="-7%" y="-7%" width="114%" height="114%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="13"/></filter>
</defs>
<rect width="800" height="1000" fill="url(#sky)"/>
<!-- pigment blooms -->
<g filter="url(#blur)" opacity=".67">
 <ellipse cx="46" cy="343" rx="140" ry="245" fill="#395a9b"/><ellipse cx="757" cy="190" rx="120" ry="220" fill="#3a3e8a"/>
 <ellipse cx="165" cy="643" rx="245" ry="98" fill="#9891c8" opacity=".7"/><ellipse cx="599" cy="618" rx="255" ry="90" fill="#e1acb9" opacity=".62"/>
 <ellipse cx="280" cy="170" rx="100" ry="145" fill="#687caf" opacity=".45"/>
</g>
<!-- faint sweeping brushstrokes -->
<g fill="none" stroke-linecap="round" filter="url(#watercolor)">
